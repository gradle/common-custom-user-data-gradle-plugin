name: Verify Build
permissions:
  contents: read
  id-token: write
on: [ push, pull_request, workflow_dispatch ]

jobs:
  verification:
    name: Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up JDK 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Get GitHub OIDC token for setup-gradle
        id: develocity-oidc
        run: |
          if [ -z "$ACTIONS_ID_TOKEN_REQUEST_URL" ]; then
            echo "::warning::No GitHub OIDC token available (e.g. PR from a fork), Develocity will not be authenticated"
            exit 0
          fi
          token=$(curl -sSfG -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            --data-urlencode "audience=https://solutions.develocity.cloud" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL" | jq -r .value)
          echo "::add-mask::$token"
          echo "access-key=solutions.develocity.cloud=$token" >> "$GITHUB_OUTPUT"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-provider: external
          develocity-access-key: ${{ steps.develocity-oidc.outputs.access-key }}
      - name: Setup Develocity Artifact Cache
        uses: gradle/develocity-artifact-cache-github-action@0d55463728b4cb8d76aab3399fcf261cf1fc4fe5 # v1.1.1
        with:
          develocity-edge-url: https://usw2-edge.solutions-team.gradle.com
          develocity-auth: workload-identity
          develocity-oidc-audience: https://solutions.develocity.cloud
          cli-version: 1.5.0
      - name: Build and publish to Maven Local with Gradle
        run: ./gradlew build publishToMavenLocal -x signPluginMavenPublication -i -Porg.gradle.java.installations.auto-download=false
        env:
          DISABLE_REQUIRED_SIGNING: true
      - name: Upload published plugin
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: common-custom-user-data-gradle-plugin
          path: ~/.m2/repository/com/gradle

  local-test:
    name: Test with Locally Published Plugin
    runs-on: ubuntu-latest
    needs: verification
    strategy:
      fail-fast: false
      matrix:
        include:
          - gradle-version: '5.0'
            java-version: '8'
          - gradle-version: '6.0'
            java-version: '8'
          - gradle-version: '6.5'
            java-version: '8'
          - gradle-version: '7.0'
            java-version: '8'
          - gradle-version: '8.0'
            java-version: '8'
          # universal-cache requires Gradle 8.1+
          - gradle-version: '9.0.0'
            java-version: '21'
            universal-cache: true
          - gradle-version: 'current'
            java-version: '21'
            universal-cache: true
          - gradle-version: 'release-candidate'
            java-version: '21'
            universal-cache: true
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up JDK ${{ matrix.java-version }}
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          java-version: '${{ matrix.java-version }}'
          distribution: 'temurin'
      - name: Get GitHub OIDC token for setup-gradle
        id: develocity-oidc
        run: |
          if [ -z "$ACTIONS_ID_TOKEN_REQUEST_URL" ]; then
            echo "::warning::No GitHub OIDC token available (e.g. PR from a fork), Develocity will not be authenticated"
            exit 0
          fi
          token=$(curl -sSfG -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            --data-urlencode "audience=https://solutions.develocity.cloud" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL" | jq -r .value)
          echo "::add-mask::$token"
          echo "access-key=solutions.develocity.cloud=$token" >> "$GITHUB_OUTPUT"
      - name: Set up Gradle ${{ matrix.gradle-version }}
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-provider: external
          develocity-access-key: ${{ steps.develocity-oidc.outputs.access-key }}
          gradle-version: '${{ matrix.gradle-version }}'
      - name: Setup Develocity Artifact Cache
        if: matrix.universal-cache
        uses: gradle/develocity-artifact-cache-github-action@0d55463728b4cb8d76aab3399fcf261cf1fc4fe5 # v1.1.1
        with:
          develocity-edge-url: https://usw2-edge.solutions-team.gradle.com
          develocity-auth: workload-identity
          develocity-oidc-audience: https://solutions.develocity.cloud
          cli-version: 1.5.0
          image-names: ccud-gradle-${{ matrix.gradle-version }}
      - name: Download plugin to maven local
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: common-custom-user-data-gradle-plugin
          path: ~/.m2/repository/com/gradle
      - name: Create the test project for Gradle 5.0, 6.0 and 6.5
        if: matrix.gradle-version == '5.0' || matrix.gradle-version == '6.0' || matrix.gradle-version == '6.5'
        run: |
          { [ "${{ matrix.gradle-version }}" == "5.0" ] && output_file="build.gradle" || output_file="settings.gradle"; }; echo """
            buildscript {
                repositories {
                mavenLocal()
                maven { url 'https://plugins.gradle.org/m2/' }
              }
                dependencies {
                classpath 'com.gradle.develocity:com.gradle.develocity.gradle.plugin:4+'
                classpath 'com.gradle.common-custom-user-data-gradle-plugin:com.gradle.common-custom-user-data-gradle-plugin.gradle.plugin:2+'
              }
            }
            
            apply plugin: 'com.gradle.develocity'
            apply plugin: 'com.gradle.common-custom-user-data-gradle-plugin'
              
            develocity {
              server = 'https://solutions.develocity.cloud'
            }
          """ > ${{ runner.temp }}/"$output_file"
          
          echo """
            rootProject.name = \"ccud-test-gradle-${{ matrix.gradle-version }}\"
          """ >> ${{ runner.temp }}/settings.gradle
          
          echo """
            org.gradle.vfs.watch=true
            org.gradle.daemon=true
            org.gradle.parallel=true
            org.gradle.caching=true
            org.gradle.jvmargs=-Duser.language=en -Duser.country=US -Dfile.encoding=UTF-8
          """ > ${{ runner.temp }}/gradle.properties

      - name: Create the test project for Gradle 7.0 and above
        if: matrix.gradle-version != '5.0' && matrix.gradle-version != '6.0' && matrix.gradle-version != '6.5'
        run: |
          echo """
            pluginManagement {
              repositories {
                gradlePluginPortal()
                exclusiveContent {
                  forRepository {
                    mavenLocal()
                  }
                  filter {
                    includeModule(\"com.gradle\", \"common-custom-user-data-gradle-plugin\")
                    includeModule(\"com.gradle.common-custom-user-data-gradle-plugin\", \"com.gradle.common-custom-user-data-gradle-plugin.gradle.plugin\")
                  }
                }
              }
            }
          
            plugins {
              id(\"com.gradle.develocity\") version \"4+\"
              id(\"com.gradle.common-custom-user-data-gradle-plugin\") version \"2+\"
            }
          
            develocity {
              server = \"https://solutions.develocity.cloud\"
            }
          
            rootProject.name = \"ccud-test-gradle-${{ matrix.gradle-version }}\"
          """ > ${{ runner.temp }}/settings.gradle
          
          echo """
            org.gradle.vfs.watch=true
            org.gradle.daemon=true
            org.gradle.parallel=true
            org.gradle.caching=true
            org.gradle.configuration-cache=true
            org.gradle.unsafe.configuration-cache=true
            org.gradle.jvmargs=-Duser.language=en -Duser.country=US -Dfile.encoding=UTF-8
          """ > ${{ runner.temp }}/gradle.properties

      - name: Run a build with the locally published plugin
        id: build-with-local-plugin
        run: gradle help "-Dscan.value.gradle-version=${{ matrix.gradle-version }}" "-Dscan.value.java-version=${{ matrix.java-version }}"
        working-directory: ${{ runner.temp }}